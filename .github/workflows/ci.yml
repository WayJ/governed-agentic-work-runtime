name: Reference runtime
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_docs.py
      - run: python -m compileall -q work_runtime tests scripts
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m work_runtime demo
      - run: python -m work_runtime publish-demo
      - run: python -m work_runtime intervention-demo
      - run: python -m work_runtime adoption-demo
      - run: python -c "import importlib.resources as r, pathlib; pathlib.Path('publishing-sample.json').write_bytes(r.files('work_runtime').joinpath('data', 'sop', 'publishing.json').read_bytes())"
      - run: python -m work_runtime lint-sop publishing-sample.json
      - run: python -m work_runtime lint-sop examples/sop/rule-cycle.json || test $? -eq 1
      - run: printf '{' > malformed-sample.json
      - run: python -m work_runtime lint-sop malformed-sample.json || test $? -eq 2
      - run: work-runtime demo
      - run: python scripts/verify_install.py
