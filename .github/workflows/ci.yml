name: Reference runtime
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_docs.py
      - run: python -m compileall -q work_runtime tests scripts
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m work_runtime demo
      - run: python -m work_runtime publish-demo
      - run: python -m work_runtime intervention-demo
      - run: work-runtime demo
      - run: python scripts/verify_install.py
